<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Seismic</title>

  <!--
    viewport-fit=cover lets the app reach under the notch and the home
    indicator; the CSS then uses env(safe-area-inset-*) to keep content clear of
    them. user-scalable=no because pinch-zooming an instrument panel only ever
    happens by accident — the 3D view has its own pinch gesture.
  -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0b0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description"
        content="Know whether your building is safe to be in — from its own measurements.">

  <!--
    A strict policy. The app is entirely self-contained apart from the USGS
    earthquake feed, which needs no key; declaring that explicitly means a
    dependency cannot be added later without someone noticing.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' gap: capacitor: https://ssl.gstatic.com;
                 script-src 'self' 'unsafe-inline';
                 style-src 'self' 'unsafe-inline';
                 img-src 'self' data: blob:;
                 media-src 'self' data: blob:;
                 connect-src 'self' https://earthquake.usgs.gov;">

  <link rel="stylesheet" href="styles/theme.css">
</head>
<body>
  <!--
    The shell renders into this. It is empty rather than containing a skeleton
    because the first paint happens within a frame of the script running, and a
    skeleton that flashes for 30 ms is worse than nothing.
  -->
  <div id="app">
    <noscript>
      <div style="padding:24px">
        <h1>Seismic</h1>
        <p>This app needs JavaScript to run its structural solver, which runs entirely on
           your device.</p>
      </div>
    </noscript>
  </div>

  <!--
    A white screen with no explanation is the worst failure an app can have, and
    on a device there is no console to open. Anything that escapes is shown
    here, with enough detail to act on.
  -->
  <script>
    (function reportFatalErrors() {
      var shown = false;
      function show(title, detail) {
        if (shown) return;
        shown = true;
        var root = document.getElementById('app');
        if (!root) return;
        root.innerHTML =
          '<div style="padding:28px;font:15px/1.5 -apple-system,system-ui;color:#f2f4f7">'
          + '<h1 style="font-size:1.3rem;margin:0 0 10px">Seismic could not start</h1>'
          + '<p style="color:#9aa2ad;margin:0 0 16px">' + title + '</p>'
          + '<pre style="white-space:pre-wrap;word-break:break-word;background:#1a1d22;'
          + 'padding:14px;border-radius:10px;font-size:12px;color:#e6b85a">'
          + String(detail).replace(/[<&]/g, function (c) {
            return c === '<' ? '&lt;' : '&amp;';
          })
          + '</pre></div>';
      }
      window.addEventListener('error', function (event) {
        show('An error stopped it before the first screen.',
          (event.message || 'Error') + '\n' + (event.filename || '')
          + ':' + (event.lineno || 0));
      });
      window.addEventListener('unhandledrejection', function (event) {
        show('Something failed while loading.',
          (event.reason && (event.reason.stack || event.reason.message)) || event.reason);
      });
    }());
  </script>

  <script type="module" src="js/app.js"></script>
</body>
</html>
